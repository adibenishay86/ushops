<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פרטי פנייה</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><h1>פרטי פנייה</h1><p>אנא מלאו את הפרטים הבאים.</p><form id="f"><label>שם מלא בעברית ובאנגלית *<input name="fullName" required></label><label>מס׳ חבילות / מספרי מעקב ביושופס *<textarea name="packagesTracking" required></textarea></label><label>תאריך ביצוע התשלום ליושופס *<input name="paymentDate" type="date" required></label><fieldset><legend>שווי המוצרים שתקועים וסכום דמי המשלוח ששילמת *</legend><div class="two"><label>שווי המוצרים<input name="stuckGoodsValue" type="number" min="0" step="0.01" required></label><label>דמי משלוח ששולמו<input name="shippingPaid" type="number" min="0" step="0.01" required></label></div></fieldset><label>תיאור קצר של התכולה *<textarea name="contentsDescription" maxlength="1000" required></textarea></label><div id="turnstile"></div><button>שליחת הפרטים</button><p id="status" role="status"></p></form></main><script type="module" src="app.js"></script></body></html>
