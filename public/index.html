<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פרטי משלוח</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>פרטי משלוח</h1><p>אנא מלאו את הפרטים הבאים. כל השדות נדרשים למעט פרטי הקשר, שבהם חובה למלא לפחות אימייל או טלפון.</p><form id="form"><label>שם מלא בעברית ובאנגלית<input name="fullName" required maxlength="200" autocomplete="name"></label><fieldset><legend>פרטי קשר</legend><div class="grid"><label>אימייל (רשות)<input name="email" type="email" maxlength="254" autocomplete="email"></label><label>טלפון (רשות)<input name="phone" type="tel" maxlength="30" autocomplete="tel"></label></div><small>חובה למלא לפחות אחד מהם.</small></fieldset><label>מס׳ חבילות / מספרי מעקב ביושופס<textarea name="packagesTracking" required maxlength="1500"></textarea></label><label>תאריך ביצוע התשלום ליושופס<input name="paymentDate" type="date" required></label><fieldset><legend>סכומים</legend><div class="grid"><label>שווי המוצרים שתקועים<input name="stuckGoodsValue" type="number" min="0" step="0.01" required></label><label>דמי משלוח ששולמו<input name="shippingPaid" type="number" min="0" step="0.01" required></label></div></fieldset><label>תיאור קצר של התכולה<textarea name="contentsDescription" required maxlength="1000"></textarea></label><button type="submit">שליחת הפרטים</button><p id="status" class="status" role="status"></p></form></main><script src="/app.js" defer></script></body></html>
