<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פרטי משלוח</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>פרטי משלוח</h1><p>אנא מלאו את הפרטים הבאים. כל השדות נדרשים.</p><form id="form"><label>שם מלא בעברית ובאנגלית<input name="fullName" required maxlength="200" placeholder="ישראל ישראלי / Israel Israeli"></label><label>מס׳ חבילות / מספרי מעקב ביושופס<textarea name="packagesTracking" required maxlength="1500"></textarea></label><label>תאריך ביצוע התשלום ליושופס<input name="paymentDate" type="date" required></label><fieldset><legend>שווי המוצרים שתקועים וסכום דמי המשלוח ששילמת</legend><div class="grid"><label>שווי המוצרים<input name="stuckGoodsValue" type="number" min="0" step="0.01" required></label><label>דמי משלוח ששולמו<input name="shippingPaid" type="number" min="0" step="0.01" required></label></div></fieldset><label>תיאור קצר של התכולה<textarea name="contentsDescription" maxlength="1000" required></textarea></label><button type="submit">שליחת הפרטים</button><p id="status" class="status" role="status"></p></form></main><script src="/app.js" defer></script></body></html>
