<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פרטי משלוח</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>פרטי משלוח</h1><p>אנא מלאו את הפרטים הבאים.</p><form id="form"><label>שם מלא בעברית ובאנגלית<input name="fullName" required></label><fieldset><legend>פרטי קשר - חובה למלא לפחות אחד</legend><div class="grid"><label>אימייל (רשות)<input name="email" type="email"></label><label>טלפון (רשות)<input name="phone" type="tel"></label></div></fieldset><label>מס׳ חבילות / מספרי מעקב ביושופס<textarea name="packagesTracking" required></textarea></label><label>תאריך ביצוע התשלום ליושופס<input name="paymentDate" type="date" required></label><div class="grid"><label>שווי המוצרים<input name="stuckGoodsValue" type="number" min="0" step="0.01" required></label><label>דמי משלוח ששולמו<input name="shippingPaid" type="number" min="0" step="0.01" required></label></div><label>תיאור קצר של התכולה<textarea name="contentsDescription" required></textarea></label><button>שליחת הפרטים</button><p id="status"></p></form></main><script src="/app.js" defer></script></body></html>
