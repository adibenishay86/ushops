<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>טופס פרטי משלוח</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
  <h1>פרטי משלוח</h1>
  <p class="intro">אנא מלאו את הפרטים הבאים. כל השדות נדרשים.</p>
  <form id="form">
    <label>שם מלא בעברית ובאנגלית
      <input name="fullName" required maxlength="200" autocomplete="name" placeholder="ישראל ישראלי / Israel Israeli">
    </label>
    <label>מס׳ חבילות / מספרי מעקב ביושופס
      <textarea name="packagesTracking" required maxlength="1500" placeholder="הזינו מספרי חבילות ו/או מספרי מעקב"></textarea>
    </label>
    <label>תאריך ביצוע התשלום ליושופס
      <input name="paymentDate" type="date" required>
    </label>
    <fieldset>
      <legend>שווי המוצרים שתקועים וסכום דמי המשלוח ששילמת</legend>
      <div class="grid">
        <label>שווי המוצרים
          <input name="stuckGoodsValue" type="number" min="0" step="0.01" required inputmode="decimal" placeholder="0.00">
        </label>
        <label>דמי משלוח ששולמו
          <input name="shippingPaid" type="number" min="0" step="0.01" required inputmode="decimal" placeholder="0.00">
        </label>
      </div>
    </fieldset>
    <label>תיאור קצר של התכולה
      <textarea name="contentsDescription" required maxlength="1000" placeholder="תיאור קצר של המוצרים"></textarea>
    </label>
    <button type="submit">שליחת הפרטים</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script src="/app.js" defer></script>
</body></html>
